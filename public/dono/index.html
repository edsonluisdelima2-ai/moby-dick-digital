<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moby Dick Digital — Painel do Dono</title>
  <style>
    :root {
      --ink: #10100e;
      --gold: #f4b83f;
      --gold2: #ffd36d;
      --cream: #fff7e5;
      --muted: #b7b1a4;
      --red: #d9432e;
      --green: #4ac074;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--ink);
      color: var(--cream);
      font-family: Inter, system-ui, sans-serif;
      line-height: 1.5;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    .panel {
      background: #191916;
      border: 1px solid rgba(244, 184, 63, 0.2);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    h1, h2 {
      color: var(--gold);
      margin: 0 0 20px 0;
    }
    h1 { font-size: 28px; }
    h2 { font-size: 20px; }
    button, input, select, textarea {
      font: inherit;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #554b37;
      background: #10100e;
      color: var(--cream);
    }
    button {
      cursor: pointer;
      background: var(--gold);
      color: #17130b;
      font-weight: bold;
      border: none;
    }
    button:hover { background: var(--gold2); }
    button.secondary {
      background: transparent;
      color: var(--gold);
      border: 1px solid var(--gold);
    }
    button.logout {
      position: fixed;
      top: 20px;
      right: 20px;
    }
    input:focus, select:focus, textarea:focus {
      outline: 2px solid var(--gold);
    }
    .form-group { margin-bottom: 15px; }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      font-size: 14px;
      color: #e9dfca;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    .full { grid-column: 1 / -1; }
    .tabs {
      display: flex;
      gap: 10px;
      border-bottom: 1px solid rgba(244, 184, 63, 0.2);
      margin-bottom: 20px;
    }
    .tab-button {
      background: transparent;
      border: none;
      padding: 10px 15px;
      color: var(--muted);
      cursor: pointer;
    }
    .tab-button.active {
      color: var(--gold);
      border-bottom: 2px solid var(--gold);
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .status {
      padding: 10px;
      border-radius: 6px;
      background: rgba(217, 67, 46, 0.1);
      color: var(--red);
      margin-bottom: 15px;
    }
    .status.success {
      background: rgba(74, 192, 116, 0.1);
      color: var(--green);
    }
    .menu-item {
      background: #26251f;
      border: 1px solid rgba(244, 184, 63, 0.2);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 10px;
    }
    .menu-item h3 { margin: 0 0 8px; color: var(--gold2); }
    .menu-item p { margin: 0; font-size: 13px; color: var(--muted); }
    .menu-item .price { font-weight: bold; color: var(--gold2); margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid rgba(244, 184, 63, 0.2); }
    th { background: rgba(244, 184, 63, 0.08); font-weight: bold; }
    .login-container { max-width: 400px; margin: 50px auto; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Moby Dick Digital</h1>
      <button class="logout" id="logout-btn" style="display:none" onclick="logout()">Sair</button>
    </div>

    <!-- SEÇÃO DE LOGIN -->
    <div id="login-section">
      <div class="login-container">
        <div class="panel">
          <h2>Acesso do Dono</h2>
          <form onsubmit="handleLogin(event)">
            <div class="form-group">
              <label>Email</label>
              <input type="email" id="email" required>
            </div>
            <div class="form-group">
              <label>Senha</label>
              <input type="password" id="password" required>
            </div>
            <button type="submit" style="width:100%">Entrar</button>
          </form>
          <div id="login-status"></div>
        </div>
      </div>
    </div>

    <!-- SEÇÃO PRINCIPAL -->
    <div id="main-section" style="display:none">
      <div class="tabs">
        <button class="tab-button active" onclick="switchTab('config', event)">Configurações</button>
        <button class="tab-button" onclick="switchTab('menu', event)">Cardápio</button>
        <button class="tab-button" onclick="switchTab('clientes', event)">Clientes</button>
      </div>

      <div id="config" class="tab-content active">
        <div class="panel">
          <h2>Informações do Restaurante</h2>
          <div id="config-status"></div>
          <form onsubmit="saveConfig(event)">
            <div class="grid">
              <div class="form-group">
                <label>Nome do Restaurante</label>
                <input type="text" id="restaurant_name" required>
              </div>
              <div class="form-group">
                <label>WhatsApp (ex: 5551999999999)</label>
                <input type="text" id="whatsapp">
              </div>
            </div>
            <div class="form-group full">
              <label>Endereço</label>
              <input type="text" id="address">
            </div>
            <div class="form-group full">
              <label>URL Google Maps</label>
              <input type="text" id="google_maps_url">
            </div>
            <button type="submit">Salvar Configurações</button>
          </form>
        </div>
      </div>

      <div id="menu" class="tab-content">
        <div class="panel">
          <h2>Adicionar Item ao Cardápio</h2>
          <form onsubmit="addMenuItem(event)">
            <div class="form-group">
              <label>Tipo</label>
              <select id="item-type" required>
                <option value="">Selecione...</option>
                <option value="prato-do-dia">Prato do Dia</option>
                <option value="promocao">Promoção</option>
                <option value="cardapio">Cardápio</option>
              </select>
            </div>
            <div class="form-group">
              <label>Nome</label>
              <input type="text" id="item-name" required>
            </div>
            <div class="form-group">
              <label>Descrição</label>
              <textarea id="item-description" rows="3"></textarea>
            </div>
            <div class="form-group">
              <label>Preço (R$)</label>
              <input type="number" id="item-price" step="0.01" required>
            </div>
            <button type="submit">Adicionar Item</button>
          </form>
        </div>

        <div class="panel">
          <h2>Itens Atuais</h2>
          <div id="menu-list"></div>
        </div>
      </div>

      <div id="clientes" class="tab-content">
        <div class="panel">
          <h2>Clientes Cadastrados</h2>
          <p style="color:var(--muted);font-size:13px">Pessoas que se cadastraram para receber o cardápio</p>
          <table id="customers-table">
            <thead>
              <tr>
                <th>Nome</th>
                <th>WhatsApp</th>
                <th>Data</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentEstablishment = null;

    window.addEventListener('load', checkAuth);

    async function checkAuth() {
      try {
        const response = await fetch('/api/owner/me');
        if (response.ok) {
          const owner = await response.json();
          showMainSection();
          loadEstablishments();
        } else {
          showLoginSection();
        }
      } catch (error) {
        console.error('Erro:', error);
        showLoginSection();
      }
    }

    function showLoginSection() {
      document.getElementById('login-section').style.display = 'block';
      document.getElementById('main-section').style.display = 'none';
      document.getElementById('logout-btn').style.display = 'none';
    }

    function showMainSection() {
      document.getElementById('login-section').style.display = 'none';
      document.getElementById('main-section').style.display = 'block';
      document.getElementById('logout-btn').style.display = 'block';
    }

    async function handleLogin(event) {
      event.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const statusDiv = document.getElementById('login-status');

      try {
        const response = await fetch('/api/owner/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        if (response.ok) {
          statusDiv.innerHTML = '<div class="status success">✓ Bem-vindo!</div>';
          setTimeout(checkAuth, 800);
        } else {
          statusDiv.innerHTML = '<div class="status">Email ou senha incorretos</div>';
        }
      } catch (error) {
        statusDiv.innerHTML = '<div class="status">Erro ao conectar</div>';
      }
    }

    async function logout() {
      await fetch('/api/owner/logout', { method: 'POST' });
      checkAuth();
    }

    function switchTab(tabName, e) {
      e.preventDefault();
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-button').forEach(el => el.classList.remove('active'));
      document.getElementById(tabName).classList.add('active');
      e.target.classList.add('active');
    }

    async function loadEstablishments() {
      try {
        const response = await fetch('/api/establishments');
        const data = await response.json();
        if (data.establishments && data.establishments.length > 0) {
          currentEstablishment = data.establishments[0];
          loadConfig();
          loadMenuItems();
          loadCustomers();
        }
      } catch (error) {
        console.error('Erro:', error);
      }
    }

    async function loadConfig() {
      if (!currentEstablishment) return;
      try {
        const response = await fetch(`/api/establishments/${currentEstablishment.id}/config`);
        const data = await response.json();
        if (data.establishment) {
          const est = data.establishment;
          document.getElementById('restaurant_name').value = est.restaurant_name || '';
          document.getElementById('whatsapp').value = est.whatsapp || '';
          document.getElementById('address').value = est.address || '';
          document.getElementById('google_maps_url').value = est.google_maps_url || '';
        }
      } catch (error) {
        console.error('Erro:', error);
      }
    }

    async function saveConfig(event) {
      event.preventDefault();
      const statusDiv = document.getElementById('config-status');
      try {
        const response = await fetch(`/api/establishments/${currentEstablishment.id}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            restaurant_name: document.getElementById('restaurant_name').value,
            whatsapp: document.getElementById('whatsapp').value,
            address: document.getElementById('address').value,
            google_maps_url: document.getElementById('google_maps_url').value
          })
        });
        if (response.ok) {
          statusDiv.innerHTML = '<div class="status success">✓ Salvo com sucesso!</div>';
        } else {
          statusDiv.innerHTML = '<div class="status">Erro ao salvar</div>';
        }
      } catch (error) {
        statusDiv.innerHTML = '<div class="status">Erro</div>';
      }
    }

    async function loadMenuItems() {
      if (!currentEstablishment) return;
      try {
        const response = await fetch(`/api/establishments/${currentEstablishment.slug}`);
        const data = await response.json();
        const menuList = document.getElementById('menu-list');
        menuList.innerHTML = '';
        if (data.items && data.items.length > 0) {
          data.items.forEach(item => {
            menuList.innerHTML += `
              <div class="menu-item">
                <h3>${item.name}</h3>
                <p>${item.description || ''}</p>
                <div class="price">R$ ${parseFloat(item.price).toFixed(2)}</div>
              </div>
            `;
          });
        } else {
          menuList.innerHTML = '<p style="color:var(--muted)">Nenhum item</p>';
        }
      } catch (error) {
        console.error('Erro:', error);
      }
    }

    async function addMenuItem(event) {
      event.preventDefault();
      try {
        const response = await fetch('/api/menu-items', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            establishment_id: currentEstablishment.id,
            type: document.getElementById('item-type').value,
            name: document.getElementById('item-name').value,
            description: document.getElementById('item-description').value,
            price: parseFloat(document.getElementById('item-price').value)
          })
        });
        if (response.ok) {
          event.target.reset();
          loadMenuItems();
        }
      } catch (error) {
        console.error('Erro:', error);
      }
    }

    async function loadCustomers() {
      if (!currentEstablishment) return;
      try {
        const response = await fetch(`/api/customers/${currentEstablishment.id}`);
        const data = await response.json();
        const tbody = document.querySelector('#customers-table tbody');
        tbody.innerHTML = '';
        if (data.customers && data.customers.length > 0) {
          data.customers.forEach(customer => {
            tbody.innerHTML += `
              <tr>
                <td>${customer.name}</td>
                <td>${customer.phone}</td>
                <td>${new Date(customer.created_at).toLocaleDateString('pt-BR')}</td>
              </tr>
            `;
          });
        }
      } catch (error) {
        console.error('Erro:', error);
      }
    }
  </script>
</body>
</html>
