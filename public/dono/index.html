<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moby Dick Digital — Área do Dono</title>
  <style>
    :root{color-scheme:dark;--ink:#10100e;--gold:#f4b83f;--gold2:#ffd36d;--cream:#fff7e5;--muted:#b7b1a4;--red:#d9432e}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--ink);color:var(--cream);font-family:Inter,system-ui,sans-serif;line-height:1.5}
    .container{max-width:1200px;margin:0 auto;padding:20px}
    .panel{background:#191916;border:1px solid rgba(244,184,63,.2);border-radius:12px;padding:20px;margin-bottom:20px}
    .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}
    h1{margin:0;color:var(--gold)}
    button,input,select,textarea{font:inherit;padding:10px;border-radius:8px;border:1px solid #554b37;background:#10100e;color:var(--cream)}
    button{cursor:pointer;background:var(--gold);color:#17130b;font-weight:bold;border:none}
    button:hover{background:var(--gold2)}
    button.secondary{background:transparent;color:var(--gold);border:1px solid var(--gold)}
    input:focus,select:focus,textarea:focus{outline:2px solid var(--gold)}
    .form-group{margin-bottom:15px}
    label{display:block;margin-bottom:5px;font-weight:bold;font-size:14px;color:#e9dfca}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
    .full{grid-column:1/-1}
    .tabs{display:flex;gap:10px;border-bottom:1px solid rgba(244,184,63,.2);margin-bottom:20px}
    .tab-button{background:transparent;border:none;padding:10px 15px;color:var(--muted);cursor:pointer}
    .tab-button.active{color:var(--gold);border-bottom:2px solid var(--gold)}
    .tab-content{display:none}
    .tab-content.active{display:block}
    .menu-item{background:#26251f;border:1px solid rgba(244,184,63,.2);border-radius:8px;padding:15px;margin-bottom:10px}
    .menu-item h3{margin:0 0 8px;color:var(--gold2)}
    .menu-item p{margin:0;font-size:13px;color:var(--muted)}
    .menu-item .price{font-weight:bold;color:var(--gold2);margin-top:10px}
    .status{padding:10px;border-radius:6px;background:rgba(217,67,46,.1);color:var(--red);margin-bottom:15px}
    .status.success{background:rgba(74,192,116,.1);color:#4ac074}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th,td{padding:10px;text-align:left;border-bottom:1px solid rgba(244,184,63,.2)}
    th{background:rgba(244,184,63,.08);font-weight:bold}
    .logout{position:fixed;top:20px;right:20px}
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Moby Dick Digital</h1>
      <button class="logout" onclick="logout()">Sair</button>
    </div>

    <div id="auth-section" style="display:none">
      <div class="panel">
        <h2>Acesso do Dono</h2>
        <div id="auth-view"></div>
      </div>
    </div>

    <div id="main-section" style="display:none">
      <div class="tabs">
        <button class="tab-button active" onclick="switchTab('config')">Configurações</button>
        <button class="tab-button" onclick="switchTab('menu')">Cardápio e Promoções</button>
        <button class="tab-button" onclick="switchTab('clientes')">Clientes</button>
      </div>

      <div id="config" class="tab-content active">
        <div class="panel">
          <h2>Informações do Restaurante</h2>
          <div id="config-status"></div>
          <form onsubmit="saveConfig(event)">
            <div class="grid">
              <div class="form-group">
                <label>Nome do Restaurante</label>
                <input type="text" id="restaurant_name" required>
              </div>
              <div class="form-group">
                <label>WhatsApp (ex: 5551999999999)</label>
                <input type="text" id="whatsapp">
              </div>
            </div>
            <div class="form-group full">
              <label>Endereço</label>
              <input type="text" id="address">
            </div>
            <div class="form-group full">
              <label>URL Google Maps</label>
              <input type="text" id="google_maps_url">
            </div>
            <button type="submit">Salvar Configurações</button>
          </form>
        </div>
      </div>

      <div id="menu" class="tab-content">
        <div class="panel">
          <h2>Prato do Dia e Promoções</h2>
          <form onsubmit="addMenuItem(event)">
            <div class="form-group">
              <label>Tipo</label>
              <select id="item-type" required>
                <option value="">Selecione...</option>
                <option value="prato-do-dia">Prato do Dia</option>
                <option value="promocao">Promoção</option>
                <option value="cardapio">Cardápio</option>
              </select>
            </div>
            <div class="form-group">
              <label>Nome</label>
              <input type="text" id="item-name" required>
            </div>
            <div class="form-group">
              <label>Descrição</label>
              <textarea id="item-description" rows="3"></textarea>
            </div>
            <div class="form-group">
              <label>Preço (R$)</label>
              <input type="number" id="item-price" step="0.01" required>
            </div>
            <div class="form-group">
              <label>Foto (PNG/JPG)</label>
              <input type="file" id="item-image" accept="image/*">
            </div>
            <button type="submit">Adicionar Item</button>
          </form>
        </div>

        <div class="panel">
          <h2>Itens Atuais</h2>
          <div id="menu-list"></div>
        </div>
      </div>

      <div id="clientes" class="tab-content">
        <div class="panel">
          <h2>Clientes Cadastrados</h2>
          <p style="color:var(--muted);font-size:13px">Pessoas que se cadastraram para receber o cardápio do dia</p>
          <table id="customers-table">
            <thead>
              <tr>
                <th>Nome</th>
                <th>WhatsApp</th>
                <th>Data</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentEstablishment = null;

    async function checkAuth() {
      try {
        const response = await fetch('/api/owner/me');
        if (response.ok) {
          const owner = await response.json();
          showMainSection();
          loadEstablishments();
        } else {
          showAuthSection();
        }
      } catch {
        showAuthSection();
      }
    }

    function showAuthSection() {
      document.getElementById('auth-section').style.display = 'block';
      document.getElementById('main-section').style.display = 'none';
      renderAuthView();
    }

    function showMainSection() {
      document.getElementById('auth-section').style.display = 'none';
      document.getElementById('main-section').style.display = 'block';
    }

    function renderAuthView() {
      const view = document.getElementById('auth-view');
      view.innerHTML = `
        <div style="max-width:400px">
          <div id="auth-mode-login">
            <h3>Entrar na área do dono</h3>
            <form onsubmit="login(event)">
              <div class="form-group">
                <label>Email</label>
                <input type="email" id="login-email" required>
              </div>
              <div class="form-group">
                <label>Senha</label>
                <input type="password" id="login-password" required>
              </div>
              <button type="submit">Entrar</button>
              <button type="button" class="secondary" onclick="toggleAuthMode()" style="width:100%;margin-top:10px">Registrar novo restaurante</button>
            </form>
          </div>

          <div id="auth-mode-register" style="display:none">
            <h3>Registrar novo restaurante</h3>
            <form onsubmit="register(event)">
              <div class="form-group">
                <label>Nome do Restaurante</label>
                <input type="text" id="register-name" required>
              </div>
              <div class="form-group">
                <label>Email</label>
                <input type="email" id="register-email" required>
              </div>
              <div class="form-group">
                <label>Senha</label>
                <input type="password" id="register-password" required>
              </div>
              <button type="submit">Registrar</button>
              <button type="button" class="secondary" onclick="toggleAuthMode()" style="width:100%;margin-top:10px">Voltar para login</button>
            </form>
          </div>
        </div>
      `;
    }

    function toggleAuthMode() {
      document.getElementById('auth-mode-login').style.display =
        document.getElementById('auth-mode-login').style.display === 'none' ? 'block' : 'none';
      document.getElementById('auth-mode-register').style.display =
        document.getElementById('auth-mode-register').style.display === 'none' ? 'block' : 'none';
    }

    async function login(event) {
      event.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      const response = await fetch('/api/owner/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      if (response.ok) {
        checkAuth();
      } else {
        alert('Email ou senha incorretos');
      }
    }

    async function register(event) {
      event.preventDefault();
      const restaurant_name = document.getElementById('register-name').value;
      const email = document.getElementById('register-email').value;
      const password = document.getElementById('register-password').value;

      const response = await fetch('/api/owner/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ restaurant_name, email, password })
      });

      if (response.ok) {
        checkAuth();
      } else {
        const error = await response.json();
        alert(error.error || 'Erro ao registrar');
      }
    }

    async function logout() {
      await fetch('/api/owner/logout', { method: 'POST' });
      checkAuth();
    }

    async function loadEstablishments() {
      const response = await fetch('/api/owner/me');
      if (response.ok) {
        const owner = await response.json();
        console.log('Owner:', owner);
      }
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-button').forEach(el => el.classList.remove('active'));
      document.getElementById(tab).classList.add('active');
      event.target.classList.add('active');
    }

    async function saveConfig(event) {
      event.preventDefault();
      alert('Funcionalidade em desenvolvimento');
    }

    async function addMenuItem(event) {
      event.preventDefault();
      alert('Funcionalidade em desenvolvimento');
    }

    checkAuth();
  </script>
</body>
</html>
